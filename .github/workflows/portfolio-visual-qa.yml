name: Portfolio visual QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install visual test browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Audit layout, assets and links at mobile + desktop
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 > /tmp/portfolio-server.log 2>&1 &
          sleep 2
          node <<'EOF'
          const { chromium } = require('playwright');
          const fs=require('fs'); const path=require('path');
          (async()=> {
            const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
            const pages=['index.html','index-de.html','index-hr.html','klarwerk-system.html','snappyfy-system.html','snappyfy-storefront.html','snappyfy-product.html'];
            const widths=[{name:'desktop',width:1440,height:1000},{name:'mobile',width:390,height:844}];
            const report=[]; let failed=false;
            fs.mkdirSync('qa-screenshots',{recursive:true});
            for(const w of widths) for(const p of pages){
              const page=await browser.newPage({viewport:{width:w.width,height:w.height},deviceScaleFactor:1});
              const errors=[]; const responses=[];
              page.on('pageerror', e=>errors.push('JS '+e.message));
              page.on('response', res=>{if(res.status()>=400)responses.push(res.status()+' '+res.url())});
              await page.goto('http://127.0.0.1:8787/'+p,{waitUntil:'networkidle',timeout:45000});
              await page.evaluate(async()=> { const imgs=[...document.images]; imgs.forEach(x=>x.loading='eager'); await Promise.all(imgs.map(x=>x.decode().catch(()=>null))); window.scrollTo(0,0); });
              await page.waitForTimeout(600);
              const check=await page.evaluate(()=>{
                const all=[...document.images].map(x=>({src:x.getAttribute('src'),ok:x.complete&&x.naturalWidth>0,natural:[x.naturalWidth,x.naturalHeight]}));
                const links=[...document.querySelectorAll('a[href^="#"]')].filter(a=>a.getAttribute('href')!=='#').map(a=>({href:a.getAttribute('href'),ok:!!document.getElementById(a.getAttribute('href').slice(1))}));
                const overflow=Math.max(0,document.documentElement.scrollWidth-innerWidth);
                const portrait=document.querySelector('.hero-profile-photo, .portrait-panel img');
                return {overflow,images:all,links,portrait:portrait?.getAttribute('src')||null};
              });
              if(['index.html','index-de.html','index-hr.html'].includes(p)){
                const expectedLang=p==='index.html'?'en':p==='index-de.html'?'de':'hr';
                const actualLang=await page.locator('html').getAttribute('lang');
                if(actualLang!==expectedLang)errors.push('Wrong html language: '+actualLang+' != '+expectedLang);
                const education=page.locator('#education .education-qualification');
                if(await education.count()!==1)errors.push('Education section not found');
                else if(!(await education.innerText()).includes('pristup. oec.'))errors.push('Education designation missing');
                const portrait=page.locator('.hero-portrait img');
                if(await portrait.count()!==1)errors.push('Hero portrait missing');
                else if(!(await portrait.evaluate(el=>el.complete&&el.naturalWidth>0)))errors.push('Hero portrait not loaded');
                if(await page.locator('.language-switch a').count()!==3)errors.push('Expected EN/DE/HR language links');
                if(await page.locator('.language-switch a[aria-current="page"]').count()!==1)errors.push('Exactly one current language expected');
                if(await page.locator('.project-card').count()!==2)errors.push('Existing project count changed');
                if(await page.locator('.sys-board-row').count()!==2)errors.push('Two project architecture maps missing');
                if(await page.locator('.sys-board-row .sys-node').count()!==8)errors.push('Expected 8 connected architecture nodes');
                if(await page.locator('.sys-tool-strip-list img').count()<7)errors.push('Background brand-logo strip missing');
                if(await page.locator('link[href="systems-visuals.css"]').count()!==1)errors.push('Architecture CSS missing');
                if(await page.locator('.chip-row img').count()<6)errors.push('Project icon badges missing');
                const projectTitles=await page.locator('.sys-board-context h4').allTextContents();
                if(projectTitles.length!==2||!projectTitles[0].includes('Snappyfy')||!projectTitles[1].includes('Klarwerk'))errors.push('Architecture subject mismatch');

                const exp=page.locator('button.expand-button').first();
                if(await exp.count()){
                  await exp.click();
                  if(await exp.getAttribute('aria-expanded')!=='true')errors.push('Project case study failed to open');
                  await page.waitForTimeout(340);
                  await exp.click();
                  await page.waitForTimeout(340);
                  if(await exp.getAttribute('aria-expanded')!=='false')errors.push('Project case study failed to close');
                }else errors.push('Project accordion missing');
                const career=page.locator('details.role-details').first();
                if(await career.count()){
                  await career.locator('summary').click();
                  if(!await career.evaluate(el=>el.open))errors.push('Career details did not open');
                  await career.locator('summary').click();
                  if(await career.evaluate(el=>el.open))errors.push('Career details did not close');
                }else errors.push('Career disclosure missing');
                if(expectedLang==='hr'){
                  const heading=await page.locator('h2').first().innerText();
                  if(!/digitalne operacije/i.test(heading))errors.push('Croatian hero heading missing');
                  if(!(await page.locator('body').innerText()).includes('Profesionalno'))errors.push('Croatian body translation missing');
                }
              }
              if(['snappyfy-system.html','klarwerk-system.html'].includes(p)){
                if(await page.locator('.sys-case').count()!==1)errors.push('Case-study architecture visual missing');
                if(await page.locator('.sys-case-board .sys-node').count()!==4)errors.push('Case-study four-step flow missing');
                if(await page.locator('.sys-case-tools img').count()<4)errors.push('Case-study branded tools missing');
              }
              if(check.overflow>2)errors.push('Horizontal overflow '+check.overflow+'px');
              const internal=await page.locator('a[href]').evaluateAll(els=>els.map(a=>a.getAttribute('href')).filter(h=>h && !h.startsWith('http') && !h.startsWith('mailto:') && !h.startsWith('#')));
              for(const href of internal){const pagefile=href.split('#')[0].split('?')[0];if(pagefile && !fs.existsSync(pagefile))errors.push('Missing internal page '+href)}
              for(const im of check.images.filter(x=>!x.ok))errors.push('Image failed '+im.src);
              for(const l of check.links.filter(x=>!x.ok))errors.push('Broken anchor '+l.href);
              if(responses.length)errors.push(...responses);
              await page.evaluate(()=>window.scrollTo({top:0,behavior:'instant'}));
              await page.waitForTimeout(180);
              const out='qa-screenshots/'+p.replace(/\.html$/,'')+'-'+w.name+'.jpeg';
              await page.screenshot({path:out,fullPage:true,type:'jpeg',quality:72});
              report.push({page:p,viewport:w.name,overflow:check.overflow,images:check.images.length,portrait:check.portrait,errors,screenshot:out});
              console.log(JSON.stringify(report.at(-1)));
              if(errors.length)failed=true;
              await page.close();
            }
            fs.writeFileSync('qa-screenshots/report.json',JSON.stringify(report,null,2));
            await browser.close();
            if(failed)process.exitCode=1;
          })().catch(e=>{console.error(e);process.exitCode=1});
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-visual-report
          path: qa-screenshots/
          retention-days: 7
